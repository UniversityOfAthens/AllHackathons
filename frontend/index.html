<!doctype html>
<!-- lang="el": the UI copy is Greek-first, and browsers only apply Greek's
     accent-dropping uppercase rules when the content language says so. With
     lang="en", `text-transform: uppercase` paints "ΈΝΑ ΜΈΡΟΣ ΓΙΑ ΌΛΑ" instead
     of "ΕΝΑ ΜΕΡΟΣ ΓΙΑ ΟΛΑ" (CSS Text 3 §2.1). -->
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Editorial fonts (issue #3) are self-hosted & Greek-capable — declared in
         src/fonts.css (Literata serif · Manrope body · JetBrains Mono labels).
         Regenerate the woff2 with `node scripts/fetch-fonts.mjs`. -->
    <title>GreekHackathons</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
